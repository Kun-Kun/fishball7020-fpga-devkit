# tools/flash.sh, `./devkit selftest --ssh` and `./devkit net` log in as root with
# a password, as on the vendor firmware.
#
# On an untrusted network, add a key to /root/.ssh/authorized_keys and set
# PasswordAuthentication no; only the BOARD_PASS default relies on passwords.
PermitRootLogin yes
PasswordAuthentication yes
