# tools/flash.sh, `./devkit selftest --ssh` and `./devkit net` all log in as root
# with a password, because that is what the vendor firmware does and every tool
# in this repo was written against it. Keep that working.
#
# This is a radio on a lab network, not a server. If yours is somewhere less
# friendly, put a key in /root/.ssh/authorized_keys and set
# PasswordAuthentication no - nothing in the repo depends on passwords except the
# default of BOARD_PASS.
PermitRootLogin yes
PasswordAuthentication yes
