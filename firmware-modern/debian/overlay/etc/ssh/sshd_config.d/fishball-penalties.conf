# ./devkit gpio-check, ./devkit selftest --ssh and tools/flash.sh open many
# short ssh connections in quick succession. OpenSSH 9.8+ PerSourcePenalties
# blocks a source for 15 s or more after connections it considers aborted, and
# the tools then fail with "Permission denied, please try again".
#
# On an untrusted network, prefer an ssh key and ControlMaster in the tools over
# re-enabling this.
PerSourcePenalties no
