# ./devkit gpio-check, ./devkit selftest --ssh and tools/flash.sh each open MANY
# short-lived ssh connections in quick succession. OpenSSH 9.8 added
# PerSourcePenalties, on by default, which penalises a source address for at
# least 15 s after connections it considers aborted - and the symptom partway
# through a tool run is "Permission denied, please try again", which sends you
# looking at passwords instead.
#
# dropbear, which this rootfs replaces, had no such mechanism, so every tool in
# this repo was written against a daemon that did not do this.
#
# This is a lab radio on a network you control. If yours is not, prefer an ssh
# key and ControlMaster in the tools over re-enabling this.
PerSourcePenalties no
