# Stop systemd-logind restarting forever when it fails. logind is also masked
# (../systemd-logind.service -> /dev/null); this bounds it if it is unmasked.
#
# On this board logind can spin without sending READY=1 until its 90 s start
# timeout kills it, then restart. Upstream it is Restart=always, RestartSec=0,
# and the default rate limit is 5 starts in 10 s; a failure that takes 90 s
# never trips that limit, so the loop runs forever. It saturates PID 1, so
# `systemctl` blocks and shutdown jobs queue behind it until the board no longer
# reboots.
#
# A window longer than the failure makes the limiter work: three attempts, then
# the unit stays failed. Nothing here needs logind (no seats, no user sessions,
# ssh does not depend on it).
[Unit]
StartLimitIntervalSec=10min
StartLimitBurst=3

[Service]
# Not 0: back-to-back restarts of a 90 s failure leave PID 1 no gap.
RestartSec=10s
