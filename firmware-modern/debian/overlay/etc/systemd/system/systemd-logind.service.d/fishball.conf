# Stop systemd-logind restarting forever when it fails, because on this board
# that takes the whole machine down with it.
#
# MEASURED. Seen on 2026-09-28, from the serial console and the previous boot's
# journal:
#
#   systemd-logind.service: start operation timed out. Terminating.
#   systemd-logind.service: Consumed 26.407s CPU time.
#   systemd-logind.service: Scheduled restart job, restart counter is at 7.
#
# logind spins - it burns ~26 s of CPU and never sends READY=1, so its 90 s start
# timeout expires, it is SIGKILLed, and it starts again. It never logs a line of
# its own, so it is spinning before it gets that far. On a 666 MHz dual-core that
# is a permanent CPU load AND an endless stream of jobs through PID 1.
#
# WHY IT NEVER STOPS BY ITSELF, which is the part worth knowing: the upstream
# unit is Restart=always with RestartSec=0, and systemd's default loop protection
# is 5 starts within 10 s. Each failure here takes ninety seconds, so the burst
# counter has expired long before the next attempt and the rate limiter NEVER
# trips. A failure slow enough defeats the protection designed to catch it.
#
# What that costs, and why this file exists rather than a note somewhere: with
# PID 1 saturated, `systemctl` blocks while `ps` still shows PID 1 idle in
# do_epoll_wait, and at shutdown every stop job queues behind the loop. That is
# how systemd-random-seed's ExecStop - 0.051 s when run by hand - took twenty
# minutes, and why systemd-shutdown never ran and the SoC never reset. The board
# then looks dead on the bench and gets its power pulled, which risks the next
# boot starting the same way.
#
# A window longer than the failure makes the limiter work as intended: three
# attempts, then systemd gives up and leaves the unit failed. Nothing on this
# board needs logind - there are no seats and no user sessions, ssh does not
# depend on it - so a failed logind is an inconvenience, where a looping one is
# a board that will not reboot.
[Unit]
StartLimitIntervalSec=10min
StartLimitBurst=3

[Service]
# Not 0. Back-to-back restarts of something that takes 90 s to fail give PID 1
# no gap at all.
RestartSec=10s
