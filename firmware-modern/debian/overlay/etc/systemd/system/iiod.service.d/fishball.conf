# Serve libiio over USB as well as TCP, when the gadget is present - via a wrapper
# that checks, so a gadget failure cannot take the network daemon with it. See
# /usr/local/sbin/fishball-iiod.
#
# Also drops Requires=systemd-udev-settle.service, which the upstream unit pulls in
# and which systemd deprecates loudly at every boot:
#   "systemd-udev-settle.service is deprecated. Please fix iiod.service not to
#    pull it in."
# The IIO devices come from built-in drivers that have probed long before
# multi-user.target, so there is nothing to settle for.
[Unit]
Requires=
After=network.target fishball-usb-gadget.service fishball-rf-quiesce.service fishball-identity.service

[Service]
ExecStart=
ExecStart=/usr/local/sbin/fishball-iiod

# RE-BIND THE GADGET AFTER EVERY START. Measured, 2026-09-28.
#
# iiod is not only a daemon here: it is the userspace provider for ffs.iio_ffs,
# a function inside the composite USB gadget. So stopping or restarting it drops
# the functionfs endpoint and the whole gadget unbinds from the controller -
# network, USB console, everything. On the host:
#
#     usb 3-1.1: USB disconnect, device number 75
#     rndis_host ... unregister 'rndis_host' ... RNDIS device
#
# and it never comes back, because fishball-usb-bind.service is Type=oneshot
# with RemainAfterExit=yes: it ran at boot, it is still "active", and nothing
# re-runs it. The board is then unreachable over USB until it is rebooted. Any
# command issued over that link - `systemctl restart iiod` itself, most of all -
# kills its own transport mid-flight and reads as a hang.
#
# ExecStartPost rather than PartOf=iiod.service on the bind unit, which was the
# obvious answer and is worse: PartOf propagates only EXPLICIT stop/restart, so
# an iiod crash picked up by Restart=on-failure would restart iiod and leave the
# gadget dead. This runs on every start, however it was reached.
#
# `-` because the network daemon must not be hostage to the USB side - the same
# reason /usr/local/sbin/fishball-iiod decides about -F at start time. The script
# is idempotent: it exits early when the UDC is already bound, so the run at boot
# and fishball-usb-bind.service's own run do not fight.
ExecStartPost=-/usr/local/sbin/fishball-usb-bind
