# Serve libiio over USB as well as TCP, when the gadget is present - via a wrapper
# that checks, so a gadget failure cannot take the network daemon with it. See
# /usr/local/sbin/fishball-iiod.
#
# Also drops Requires=systemd-udev-settle.service, which the upstream unit pulls in
# and which systemd deprecates loudly at every boot:
#   "systemd-udev-settle.service is deprecated. Please fix iiod.service not to
#    pull it in."
# The IIO devices come from built-in drivers that have probed long before
# multi-user.target, so there is nothing to settle for.
[Unit]
Requires=
After=network.target fishball-usb-gadget.service fishball-rf-quiesce.service fishball-identity.service

[Service]
ExecStart=
ExecStart=/usr/local/sbin/fishball-iiod
