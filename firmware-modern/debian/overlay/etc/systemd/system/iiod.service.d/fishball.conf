# Serve libiio over USB as well as TCP when the gadget is present, through a
# wrapper that checks, so a gadget failure cannot stop the network daemon. See
# /usr/local/sbin/fishball-iiod. The udev-settle dependency is removed in
# ../iiod.service, which replaces the packaged unit.
#
# Fail closed on the boot TX quiesce. iiod is the one process that opens a
# transmit buffer unprompted, so it does not start unless fishball-rf-quiesce
# succeeded: both attenuators read back at -89.75 dB and, where the kernel has
# tx_cyclic_timeout_ms, the cyclic bound read back as set (a kernel without that
# attribute only gets a warning). When iiod is held back, fishball-usb-bind binds
# the gadget without iiod's USB function, so usb0 stays up to diagnose it.
# Requires= also propagates a stop or restart of the quiesce unit to iiod.
[Unit]
Requires=fishball-rf-quiesce.service
After=network.target fishball-usb-gadget.service fishball-rf-quiesce.service fishball-identity.service

[Service]
ExecStart=
ExecStart=/usr/local/sbin/fishball-iiod

# Rebind the USB gadget after every iiod start and stop.
#
# iiod provides the FunctionFS function (ffs.iio_ffs) inside the composite
# gadget, so stopping or restarting it unbinds the whole gadget: USB network and
# console go down. fishball-usb-bind.service is a oneshot that already ran at
# boot, so nothing else rebinds it, and `systemctl restart iiod` over USB would
# cut its own link until a reboot.
#
# ExecStartPost, not PartOf=iiod.service on the bind unit: PartOf covers only
# explicit stop/restart, not a Restart=on-failure after a crash.
#
# `-` so a USB failure never fails iiod. fishball-usb-bind converges (bound with
# iiod's function when iiod serves it, without it otherwise) and does nothing if
# the gadget already matches, so it does not conflict with the boot-time run.
#
# ExecStopPost covers stopping iiod, including via Requires= when the quiesce
# unit stops or fails to restart. --no-wait: iiod is gone, nothing to wait for.
ExecStartPost=-/usr/local/sbin/fishball-usb-bind
ExecStopPost=-/usr/local/sbin/fishball-usb-bind --no-wait
