# fstrim ran at EVERY boot, and it was the largest single item in it.
#
#   systemd-analyze blame
#     6.822s fstrim.service        <- of a 10.455s userspace boot
#     5.180s dev-mmcblk0p2.device
#     2.455s systemd-udev-settle.service
#
# Not because anything asked it to. fstrim.timer is OnCalendar=weekly with
# Persistent=true, and THIS BOARD HAS NO RTC - there is no /dev/rtc0 and the
# clock starts wherever it was left. So systemd compares "now" against the last
# run, concludes the weekly trim was missed, and fires it immediately. Every
# time. A persistent timer on a machine with no clock is a boot-time tax.
#
# Persistent=false means it runs only if the board is up at the scheduled
# moment, which on a board with no RTC is effectively never. That is the honest
# outcome and it is the right one here: the card is written when you flash it
# and read the rest of the time, so a weekly trim earns very little.
#
# Run it deliberately when it matters:
#
#     fstrim -av        # run on the board
[Timer]
Persistent=false
