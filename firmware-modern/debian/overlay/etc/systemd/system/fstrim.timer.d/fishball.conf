# The board has no RTC, so with the default Persistent=true systemd decides at
# every boot that the weekly trim was missed and runs fstrim immediately, which
# is the slowest item in boot. Persistent=false runs it only if the board is up
# at the scheduled time. The card is mostly read, so trimming rarely matters.
#
# To trim by hand:
#
#     fstrim -av        # run on the board
[Timer]
Persistent=false
