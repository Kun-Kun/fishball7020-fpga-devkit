# The serial console login at a fixed 115200, the speed the kernel console uses.
# Debian's unit runs agetty --keep-baud 115200,57600,38400,9600, which switches to
# the next speed whenever it reads a BREAK. The DEBUG adapter is powered by the
# board and the Zynq's UART pin floats during reset, so the line can glitch as
# agetty starts; read as a BREAK, that moves the prompt to 57600 and the console
# shows no login prompt, on some boots and not others.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-- \\u' --noreset --noclear 115200 - ${TERM}
