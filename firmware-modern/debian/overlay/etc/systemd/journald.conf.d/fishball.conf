# Bound journald's writes to the SD card. Persistent, so logs of a boot that
# failed are still there after the next one.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=32M
SystemMaxFileSize=8M
# Default 5 min; 10 min halves the flushes. The serial console still shows
# messages live.
SyncIntervalSec=10m
