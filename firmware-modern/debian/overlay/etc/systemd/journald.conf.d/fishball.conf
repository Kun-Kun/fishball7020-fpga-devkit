# This root lives on a consumer SD card, and the rootfs it replaced was a RAM
# disk that wrote to the card NEVER. journald is the single biggest new source of
# writes, so bound it.
#
# Persistent rather than volatile on purpose: the failure this board actually has
# is "it did not come up", and logs that vanish on reboot are no help with that.
# The cost is bounded instead.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=32M
SystemMaxFileSize=8M
# Default is 5 minutes; 10 halves the flush count for no practical loss, since
# ForwardToConsole keeps the serial console live either way.
SyncIntervalSec=10m
