# Bound how long shutdown can take, and make sure the board resets at the end.
#
# Stop jobs on this board can stall during shutdown far past their own
# TimeoutStopSec (networking, systemd-random-seed), and systemd-shutdown can then
# hang without resetting the SoC, leaving the board dead until power is pulled.
# See also systemd-logind.service.d/fishball.conf.

[Manager]
# 20 s instead of Debian's 90 s. Nothing here needs longer to stop.
DefaultTimeoutStopSec=20s

# If shutdown stalls anyway, the Zynq watchdog resets the board. It is available:
# watchdog@f8005000 (cdns,wdt-r1p2) is enabled in the SoC dtsi and
# CONFIG_CADENCE_WATCHDOG=y is in fishball_defconfig (/dev/watchdog0).
RebootWatchdogSec=60s
