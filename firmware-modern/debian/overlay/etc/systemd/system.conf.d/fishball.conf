# Bound how long this board can take to shut down, and make sure it actually
# resets at the end.
#
# MEASURED, not precautionary. Before this file, one reboot took twenty-nine
# minutes and then did not reboot:
#
#   networking.service/stop        ran 9min 17s  (TimeoutStopSec is 1min 30s)
#   systemd-random-seed/stop       ran 20min     (TimeoutStopSec is 10min)
#   systemd-user-sessions/stop     ran 3min 17s
#   systemd-tmpfiles-clean/stop    ran 1min 30s
#
# and the console then went silent after reboot.target - systemd-shutdown never
# printed "Unmounting file systems", the SoC never reset, and the board sat dead
# until someone pulled the power. Every "the board has hung" in this project's
# history is consistent with that, and each of those power cuts is what corrupts
# the journal, which is why the evidence kept disappearing.
#
# The units are not at fault. Run by hand on the same board, their ExecStop
# commands take 0.051 s (systemd-random-seed save) and 1.273 s (ifdown -a), and
# `systemctl stop systemd-random-seed` while the system is up takes 0.283 s. The
# stalls only happen in the shutdown transition, and they overran their own
# configured TimeoutStopSec severalfold, so whatever it is, it is not something
# a per-unit timeout was going to contain.

[Manager]
# 20s instead of Debian's 90s. Nothing on this board legitimately needs longer
# to stop: the slowest thing here writes a 512-byte seed file to an SD card that
# measures 12.9 MB/s. This is what turns a multi-minute stall into a blip.
DefaultTimeoutStopSec=20s

# The safety net for the part above that is still not explained: if the shutdown
# stalls anyway, the Zynq's own watchdog resets the board instead of leaving it
# dead on the bench. watchdog@f8005000 (cdns,wdt-r1p2) is in the SoC's dtsi with
# no status="disabled", CONFIG_CADENCE_WATCHDOG=y is in fishball_defconfig, and
# /dev/watchdog0 is present on a running board - so this is armed, not hopeful.
# It was NOT exercised by the run that verified this file: the shutdown finished
# in 20 seconds and never got near it.
RebootWatchdogSec=60s
