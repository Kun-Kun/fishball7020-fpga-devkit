name: Release

# Cutting a release used to be a manual sequence: build, copy five files out of
# firmware/output/, sha256sum them, write the notes, upload. Every step is a
# chance to ship a checksum that does not match the file beside it, or notes
# that describe a build nobody kept.
#
# This does the packaging half. It deliberately does NOT build the firmware -
# Vivado cannot run on a hosted runner and a 25 GB toolchain has no business in
# CI - so the artifacts come from a build you made and verified yourself, and
# the workflow's job is to check them and publish them unaltered.
#
# WHERE THE ARTIFACTS ARE, WHICH IS NOT WHERE YOU WOULD THINK.
#
# `actions/checkout` clones into the runner's own `_work` directory. It does NOT
# use your working tree - and every build artifact here is gitignored, so the
# checkout contains none of them. An earlier version of this workflow read
# `firmware/output/` relative to the checkout, which is always empty; it could
# never have published anything, for either target, and nobody noticed because it
# was gated off behind an unregistered runner for its whole life.
#
# So it reads from the REAL build tree on the runner host - `BUILD_TREE`, default
# ~/fishball7020-fpga-devkit - and first checks that tree is sitting on the exact
# commit the tag points at. Without that check a release could carry artifacts
# built from something other than what it claims, which is the one property a
# release exists to guarantee.
#
#     ./devkit build && ./devkit verify --board      # on your machine, with a board
#     gh workflow run release.yml -f tag=v1.3        # attaches the artifacts from
#                                                    # the self-hosted runner
#
# TWO TARGETS, AND THEY CANNOT SHARE ONE CHECK.
#
# `firmware/` produces five files on one FAT partition and can be verified with
# `./devkit verify --board`, which md5-compares the card against firmware/output/.
# `firmware-modern/` produces a kernel, a device tree and a 295 MB Debian rootfs
# tarball, on a card with TWO partitions - so the five-file assertion is not
# merely unmet, it is unmeetable, and `verify --board` has nothing to compare.
#
# v2.0 was therefore cut entirely by hand. This workflow now knows about both:
#
#     gh workflow run release.yml -f tag=v2.1 -f target=modern
#     gh workflow run release.yml -f tag=v1.6 -f target=factory
#
# A pushed tag picks its target from its own number - v1.x is factory, v2.x is
# modern - which is this repo's numbering convention. A workflow_dispatch input
# overrides that. Each target is verified in the way it CAN be verified, and
# neither borrows the other's evidence.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.3). Must already exist."
        required: true
        type: string
      target:
        description: "Which firmware target to package"
        required: false
        default: modern
        type: choice
        options: [modern, factory]

permissions:
  contents: write

jobs:
  package:
    # Runs where the build is. A hosted runner has no firmware/output/, so this
    # needs the same self-hosted runner the hardware checks use; see
    # .github/workflows/hardware.yml for how that is registered.
    runs-on: [self-hosted, fishball-board]
    # Same gate as hardware.yml: without a registered runner this would queue
    # forever instead of failing visibly.
    if: vars.HARDWARE_RUNNER == 'enabled'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Find the build tree, and prove it matches the tag
        id: tree
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          BUILD="${BUILD_TREE:-$HOME/fishball7020-fpga-devkit}"
          [ -d "$BUILD/.git" ] || {
            echo "no build tree at $BUILD - set BUILD_TREE to the clone you build in" >&2
            exit 1; }
          echo "  build tree: $BUILD"

          # The artifacts are gitignored, so they can only come from a working
          # tree somebody built in. That makes "which commit was it built from?"
          # unanswerable from the files themselves - so require the tree to be ON
          # the tag. Otherwise this would happily publish yesterday's binaries
          # under today's tag.
          want=$(git rev-parse "refs/tags/$TAG^{commit}")
          have=$(git -C "$BUILD" rev-parse HEAD)
          if [ "$want" != "$have" ]; then
            echo "REFUSING: $BUILD is at $have but tag $TAG is $want." >&2
            echo "          Check the build tree out at the tag and rebuild, or" >&2
            echo "          tag the commit you actually built." >&2
            exit 1
          fi
          echo "  at $have, which is $TAG"

          # A dirty tree means the artifacts may not correspond to any commit.
          if [ -n "$(git -C "$BUILD" status --porcelain --untracked-files=no)" ]; then
            echo "REFUSING: $BUILD has uncommitted changes to tracked files." >&2
            git -C "$BUILD" status --short --untracked-files=no >&2
            exit 1
          fi
          echo "  clean"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          # Also as $B in the environment of every later step, so each one does not
          # need its own `env:` block repeating the same expression.
          echo "B=$BUILD" >> "$GITHUB_ENV"

      - name: Which target, and say so loudly
        id: target
        # A pushed tag has no inputs, so the target is INFERRED FROM THE TAG,
        # following this repo's own numbering: v1.x is the factory
        # (Buildroot/5.15) target and v2.x is the modern (Debian/6.12) one.
        #
        # It used to default to `modern` regardless. That is wrong for a v1.x
        # tag and fails in a way that looks alarming but is not: the modern
        # check compares modern artefacts against a board that is running the
        # factory firmware, sees DIFFERS, and refuses. Correct behaviour,
        # useless signal - v1.7 was cut with a red X against its tag for exactly
        # this reason, and every future factory tag would have repeated it.
        #
        # An explicit workflow_dispatch input still wins, so a tag that does not
        # follow the convention can be released by hand.
        run: |
          tgt="${{ inputs.target }}"
          if [ -z "$tgt" ]; then
            case "${GITHUB_REF_NAME:-}" in
              v1.*) tgt=factory ;;
              v2.*) tgt=modern ;;
              *)    tgt=modern ;;
            esac
            echo "  no target given - inferred '$tgt' from the tag ${GITHUB_REF_NAME:-?}"
          fi
          case "$tgt" in
            modern|factory) ;;
            *) echo "unknown target '$tgt'" >&2; exit 1 ;;
          esac
          echo "target=$tgt" >> "$GITHUB_OUTPUT"
          echo "  releasing the '$tgt' target"

      - name: The artifacts this target needs must all be present
        run: |
          missing=0
          have() {
            if [ -r "$1" ]; then printf '  %-46s %10s B\n' "$1" "$(stat -c%s "$1")"
            else echo "  MISSING $1" >&2; missing=1; fi
          }
          if [ "${{ steps.target.outputs.target }}" = "factory" ]; then
            for f in BOOT.bin devicetree.dtb uEnv.txt uImage uramdisk.image.gz; do
              have "$B/firmware/output/$f"
            done
            [ "$missing" -eq 0 ] || { echo "Build first: ./devkit build" >&2; exit 1; }
          else
            # No BOOT.bin in the release, deliberately. firmware-modern/ can now
            # build one (issue #9), but only from an imported XSA - never from
            # source - and this job's rule is that what it ships was built here.
            # The notes point at the factory release for it instead.
            have "$B/firmware-modern/output/uImage"
            have "$B/firmware-modern/output/devicetree.dtb"
            have "$B/firmware-modern/debian/rootfs.tar"
            [ "$missing" -eq 0 ] || {
              echo "Build first: ./firmware-modern/setup.sh, make uImage," >&2
              echo "then firmware-modern/debian/build.sh" >&2; exit 1; }
          fi

      - name: This build must have been made from source, not imported
        # --xsa lets anyone build firmware from a hardware platform somebody
        # else produced. That is the point of it - and it is exactly what a
        # RELEASE must not be. A release is the authoritative build, so its
        # bitstream has to come from the sources in this repository, with a
        # timing report to show for it. build_all.sh --xsa leaves this file.
        #
        # Only the factory target ships a bitstream, so only it can fail this.
        if: steps.target.outputs.target == 'factory'
        run: |
          if [ -r "$B/firmware/output/xsa-provenance.txt" ]; then
            echo "ERROR: this output/ was built with --xsa, from an imported" >&2
            echo "       hardware platform. A release must be built from the" >&2
            echo "       sources here so its bitstream has known provenance." >&2
            echo >&2
            sed -n '1,5p' "$B/firmware/output/xsa-provenance.txt" >&2
            echo >&2
            echo "       Run a full ./devkit build and try again." >&2
            exit 1
          fi
          echo "built from source - no imported platform"

      - name: The build must pass its own verification
        if: steps.target.outputs.target == 'factory'
        # In $B, not the checkout. actions/checkout clones into _work/, where
        # firmware/src/ and firmware/output/ do not exist - they are gitignored
        # build products that only exist in the tree somebody built in. Run here,
        # this reported six FAILs and "PROBLEMS FOUND - do not flash this build"
        # about a perfectly good build, because it was looking at an empty tree.
        run: cd "$B" && ./devkit verify

      - name: The board must be running exactly these files (factory)
        # A release whose artifacts were never booted is a guess. This is the
        # whole reason the job runs on the machine with the board attached.
        # verify --board md5-compares the card against firmware/output/'s five
        # files, which only works when the card HAS those five files.
        #
        # --require-board, NOT --board. Plain `verify --board` exits with the
        # BUILD's verdict, and a board that is unreachable, unmountable or
        # running something else leaves that verdict at 0 - so this gate passed
        # unconditionally, including on a board that was never contacted. The
        # card must have been read, and every file must have matched.
        if: steps.target.outputs.target == 'factory'
        run: cd "$B" && ./devkit verify --require-board

      - name: The board must be running exactly these files (modern)
        # The same requirement, met the only way it can be for this target.
        # `verify --board` cannot help: the card has two partitions and four boot
        # files, so there is nothing for it to compare. What IS checkable - and
        # what was done by hand for v2.0 - is that each artifact about to be
        # published is byte-identical to what the board booted. That is a
        # stronger statement than "the build passed", and it is the one claim the
        # notes make.
        if: steps.target.outputs.target == 'modern'
        env:
          BOARD_PASS: ${{ secrets.BOARD_PASS || 'analog' }}
        run: |
          set -eu
          board=""
          for c in "${BOARD:-}" fishball.local 192.168.2.1; do
            [ -n "$c" ] || continue
            sshpass -p "$BOARD_PASS" ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR \
              -o ConnectTimeout=8 "root@$c" true 2>/dev/null && { board="$c"; break; }
          done
          [ -n "$board" ] || { echo "no board reachable - a modern release is verified against one" >&2; exit 1; }
          echo "  board: $board"
          bad=0
          for f in uImage devicetree.dtb; do
            local_sum=$(sha256sum "$B/firmware-modern/output/$f" | cut -d' ' -f1)
            board_sum=$(sshpass -p "$BOARD_PASS" ssh -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR \
                "root@$board" "sha256sum /boot/$f" 2>/dev/null | cut -d' ' -f1)
            if [ "$local_sum" = "$board_sum" ]; then
              printf '  %-18s %s  matches the booted file\n' "$f" "$(echo "$local_sum" | cut -c1-16)"
            else
              printf '  %-18s local %s  board %s   DIFFERS\n' "$f" \
                "$(echo "$local_sum" | cut -c1-16)" "$(echo "${board_sum:-none}" | cut -c1-16)" >&2
              bad=1
            fi
          done
          # And the board must actually be running the kernel we are shipping,
          # not merely have it sitting in /boot unbooted.
          echo "  running kernel: $(sshpass -p "$BOARD_PASS" ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR "root@$board" 'uname -r' 2>/dev/null)"
          # The transmitter must be silent at probe. This is the one property
          # whose failure has a cost outside the board, so it gates the release.
          for ch in 0 1; do
            g=$(sshpass -p "$BOARD_PASS" ssh -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR "root@$board" \
                "cat /sys/bus/iio/devices/iio:device0/out_voltage${ch}_hardwaregain" 2>/dev/null)
            printf '  TX%s at probe: %s\n' "$ch" "$g"
            case "$g" in -89.7*) ;; *) echo "    ^ NOT muted - refusing to release" >&2; bad=1 ;; esac
          done
          [ "$bad" -eq 0 ] || exit 1

      - name: The rootfs tarball must carry no board identity (modern)
        # It is the asset that goes to every board. Shipping the build
        # container's SSH host keys would give every board flashed from this
        # download the same private key, publicly available here. The
        # Containerfile strips them; this is the check that it did.
        if: steps.target.outputs.target == 'modern'
        run: |
          set -eu
          T="$B/firmware-modern/debian/rootfs.tar"
          keys=$(tar tf "$T" | grep -c 'etc/ssh/ssh_host_' || true)
          mid=$(tar tvf "$T" etc/machine-id 2>/dev/null | awk '{print $3}')
          echo "  ssh host keys in the tarball: $keys  (must be 0)"
          echo "  /etc/machine-id size: ${mid:-absent}  (must be 0)"
          [ "$keys" = "0" ] || { echo "    ^ REFUSING: the tarball carries private host keys" >&2; exit 1; }
          [ "${mid:-x}" = "0" ] || { echo "    ^ REFUSING: machine-id must be present and empty" >&2; exit 1; }
          grep -q 'wants/fishball-sshd-keygen' <(tar tf "$T") \
            || { echo "    ^ REFUSING: nothing will regenerate host keys on first boot" >&2; exit 1; }
          echo "  keygen unit is enabled - keys will be generated per board"

      - name: Compress the rootfs for upload (modern)
        if: steps.target.outputs.target == 'modern'
        run: |
          gzip -9 -c "$B/firmware-modern/debian/rootfs.tar" > "$B/firmware-modern/output/debian-rootfs.tar.gz"
          printf '  %-34s %s B\n' debian-rootfs.tar.gz \
            "$(stat -c%s "$B/firmware-modern/output/debian-rootfs.tar.gz")"

      - name: uEnv.txt for the two-partition card (modern)
        # write-card.sh generates this at card-write time from firmware/output's
        # base; a release has to carry it, or the assets cannot boot a card on
        # their own.
        if: steps.target.outputs.target == 'modern'
        run: |
          # ./devkit build --target modern already wrote one, from the U-Boot it
          # built (make-uenv.sh base); regenerating it here from firmware/output's
          # would ship a uEnv.txt that SHA256SUMS.boot does not describe.
          [ -s "$B/firmware-modern/output/uEnv.txt" ] || \
            "$B/firmware-modern/debian/make-uenv.sh" > "$B/firmware-modern/output/uEnv.txt"
          printf '  %-34s %s B\n' uEnv.txt "$(stat -c%s "$B/firmware-modern/output/uEnv.txt")"
          grep -c '^sdboot_debian=' "$B/firmware-modern/output/uEnv.txt" | \
            sed 's/^/  sdboot_debian lines: /'

      - name: Attach the hardware platform this bitstream came from
        # The .xsa is the FPGA design, finished, in one file - bitstream plus
        # the ps7_init.c the FSBL is compiled from. Shipping it means anyone
        # can rebuild this firmware with a kernel or rootfs change of their own
        # WITHOUT installing Vivado (~50 GB):
        #     ./scripts/build_all.sh --xsa system_top.xsa
        # It is the durable artifact of the build; firmware/src/ is regenerated
        # by setup.sh, so the Vivado project itself does not survive.
        #
        # Factory only: the .xsa is an output of the HDL build, which is what the
        # factory target runs. docs/building-without-vivado.md tells people to get
        # it from a release, and until this step runs, no release has one.
        if: steps.target.outputs.target == 'factory'
        run: |
          xsa="$B/firmware/src/hdl/projects/pluto/system_top.xsa"
          [ -r "$xsa" ] || { echo "ERROR: $xsa is missing - was this a real build?" >&2; exit 1; }
          printf '  %-20s %10s B\n' system_top.xsa "$(stat -c%s "$xsa")"

      - name: Checksums
        id: assets
        # Computed over the exact files about to be uploaded, in the directory
        # they are uploaded from, so SHA256SUMS can be verified by anyone who
        # downloads the set with `sha256sum -c`.
        run: |
          set -eu
          # Assemble the upload set in a staging directory OUTSIDE the build
          # tree. Writing SHA256SUMS and system_top.xsa into firmware/output/
          # left two extra files there, and `verify` requires that directory to
          # hold exactly the five SD-card files - so every release broke
          # ./devkit verify afterwards, and the NEXT release would have been
          # refused by its own gate. Same shape as the xsa-provenance.txt defect
          # in 7051b8e: a build step leaving something behind that a later check
          # reads as a fault.
          stage="${RUNNER_TEMP:-/tmp}/fishball-release-assets"
          rm -rf "$stage"; mkdir -p "$stage"
          if [ "${{ steps.target.outputs.target }}" = "factory" ]; then
            src="$B/firmware/output"
            files="BOOT.bin devicetree.dtb uEnv.txt uImage uramdisk.image.gz"
            for f in $files; do cp "$src/$f" "$stage/$f"; done
            cp "$B/firmware/src/hdl/projects/pluto/system_top.xsa" "$stage/system_top.xsa"
            files="$files system_top.xsa"
          else
            src="$B/firmware-modern/output"
            files="uImage devicetree.dtb uEnv.txt debian-rootfs.tar.gz"
            for f in $files; do cp "$src/$f" "$stage/$f"; done
          fi
          ( cd "$stage" && sha256sum $files > SHA256SUMS && cat SHA256SUMS )
          echo "  staged in $stage - the build tree is left untouched"
          echo "dir=$stage" >> "$GITHUB_OUTPUT"

      - name: Record what is in this bitstream
        id: facts
        # Factory only - these come from the Vivado reports, and the modern
        # target does not run Vivado. Its notes quote the kernel instead.
        if: steps.target.outputs.target == 'factory'
        run: |
          PRJ="$B/firmware/src/hdl/projects/pluto"
          {
            echo "luts=$(grep -E '^\| Slice LUTs' $PRJ/utilization.rpt | head -1 | awk -F'|' '{gsub(/ /,"",$3); print $3}')"
            echo "dsps=$(grep -E '^\| DSPs' $PRJ/utilization.rpt | head -1 | awk -F'|' '{gsub(/ /,"",$3); print $3}')"
            echo "wns=$(grep -A6 'Design Timing Summary' $PRJ/timing.rpt | awk 'NF>=8 && $1 ~ /^-?[0-9.]+$/ {print $1; exit}')"
          } >> "$GITHUB_OUTPUT"

      - name: Record what this kernel is (modern)
        id: kfacts
        if: steps.target.outputs.target == 'modern'
        run: |
          set -eu
          set -eu
          pin=$(grep -oE '[0-9a-f]{40}' "$B/firmware-modern/setup.sh" | head -1)
          # `strings` finds nothing useful in a uImage - the version lives in the
          # payload, not the header text - and an empty value would publish notes
          # reading "Linux  and a Debian userspace". mkimage -l reads the actual
          # U-Boot header, and u-boot-tools is already a doctor-checked dependency.
          kver=$(mkimage -l "$B/firmware-modern/output/uImage" | sed -n 's/^ *Image Name: *Linux-//p')
          patches=$(ls "$B"/firmware-modern/patches/*.patch | wc -l)
          for v in pin kver patches; do
            eval "val=\$$v"
            [ -n "$val" ] || { echo "could not determine $v - refusing to publish notes with a hole in them" >&2; exit 1; }
          done
          echo "  kernel $kver, ADI pin ${pin}, $patches patches"
          {
            echo "pin=$pin"
            echo "patches=$patches"
            echo "kver=$kver"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the release (factory)
        if: steps.target.outputs.target == 'factory'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd "${{ steps.assets.outputs.dir }}"
          gh release create "$TAG" \
            BOOT.bin devicetree.dtb uEnv.txt uImage uramdisk.image.gz \
            system_top.xsa SHA256SUMS \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --draft \
            --notes "Prebuilt SD-card files. Copy all five onto a FAT32 card, or
          update a running board with \`./devkit flash --all\`.

          ### \`system_top.xsa\` - build your own firmware without Vivado

          The sixth file is the **FPGA design, finished**: the bitstream plus the
          processor bring-up code the boot loader is compiled from. With it you can
          change the kernel, a driver or the root filesystem and rebuild, **without
          installing Vivado** (~50 GB):

          \`\`\`bash
          # run from: firmware/
          ./scripts/build_all.sh --xsa /path/to/system_top.xsa
          \`\`\`

          Needs nothing from AMD: the boot loader is built from AMD's embeddedsw
          with \`gcc-arm-none-eabi\` using the \`ps7_init.c\` inside this file, and
          \`bootgen\` is built from AMD's Apache-2.0 source. Full instructions:
          [Building without Vivado](https://github.com/${{ github.repository }}/blob/main/docs/building-without-vivado.md).

          This is the platform the five files above were built from, so a rebuild
          starts from exactly the same hardware design.

          Built and verified on hardware before publishing: \`./devkit verify\`
          passed, and \`./devkit verify --require-board\` read the card and
          confirmed the board was running exactly these files.

          | | |
          |---|---|
          | Slice LUTs | ${{ steps.facts.outputs.luts }} |
          | DSP48s | ${{ steps.facts.outputs.dsps }} / 220 |
          | Timing | WNS ${{ steps.facts.outputs.wns }} ns, no failing endpoints |

          Checksums in \`SHA256SUMS\`. Draft - edit the notes, then publish."
          echo "Draft release created for $TAG. Edit the notes and publish when ready."

      - name: Publish the release (modern)
        if: steps.target.outputs.target == 'modern'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd "${{ steps.assets.outputs.dir }}"
          gh release create "$TAG" \
            uImage devicetree.dtb uEnv.txt debian-rootfs.tar.gz SHA256SUMS \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --draft \
            --notes "Linux ${{ steps.kfacts.outputs.kver }} and a Debian userspace for this board.

          ### The files, and where each one goes

          The card has **two** partitions, so this is not a copy-five-files release.
          \`firmware-modern/debian/write-card.sh\` makes both and unpacks the rootfs:

          \`\`\`bash
          # run from: firmware-modern/debian/   - DESTROYS everything on the card
          gunzip -c ~/Downloads/debian-rootfs.tar.gz > rootfs.tar
          sudo BOOT_BIN=/path/to/BOOT.bin ./write-card.sh /dev/sdX
          \`\`\`

          | | |
          |---|---|
          | \`uImage\` | the kernel, ADI \`main\` pinned at \`${{ steps.kfacts.outputs.pin }}\`, with ${{ steps.kfacts.outputs.patches }} driver patches |
          | \`devicetree.dtb\` | its device tree - probes the transmitter at **89.75 dB**, not 10 dB |
          | \`uEnv.txt\` | boots the ext4 root on p2; \`fw_setenv rootfs_mode ramdisk\` switches back to Buildroot |
          | \`debian-rootfs.tar.gz\` | Debian 13 armhf + systemd, for the second partition |
          | \`SHA256SUMS\` | for the four above |

          **No \`BOOT.bin\`.** This target builds one only from an imported XSA, and
          a release ships only what was built from source. Take it from a
          **factory** release, or build it: \`./devkit build --target modern --xsa FILE\`.

          ### What was verified before this was published

          The workflow refuses to publish unless all of it holds:

          - **every file here is byte-identical to what the board booted** -
            \`uImage\` and \`devicetree.dtb\` sha256-compared against \`/boot\` on the
            running board. Not \"the build passed\"; the artifacts ran.
          - **both transmitters read −89.75 dB at probe**, before any userspace.
          - **the rootfs carries no board identity** - zero SSH host keys, an
            empty \`/etc/machine-id\`, and the keygen unit enabled so each board
            makes its own on first boot. Shipping the build container's keys would
            put one private host key on every board flashed from this download.

          Checksums in \`SHA256SUMS\`. Draft - edit the notes, then publish."
          echo "Draft release created for $TAG. Edit the notes and publish when ready."
