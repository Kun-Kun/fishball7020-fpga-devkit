name: Docs

# Every relative link and #anchor in the documentation resolves, and every
# command block says where to run it. Fetches nothing, so it is fast and never
# flaky; external links are not checked.

on:
  push:
    paths:
      - "**.md"
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Links, anchors and "run from" lines
        run: python docs/check_links.py
